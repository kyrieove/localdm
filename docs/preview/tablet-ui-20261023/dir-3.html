<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方向三 · 牌桌</title>
<style>
/* 预览控制条与共用素材（不属于设计本身） */
*{box-sizing:border-box}
html,body{margin:0;background:#2b2c2e;font:13px/1.4 "Microsoft YaHei UI","Microsoft YaHei","PingFang SC",sans-serif;color:#d9dadc}
#ctl{position:sticky;top:0;z-index:50;background:#1d1e20;border-bottom:1px solid #3a3b3e;padding:8px 12px;display:flex;flex-direction:column;gap:6px}
#ctl .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#ctl strong{font-size:14px;color:#fff;margin-right:8px}
#ctl .note{color:#8d9096;font-size:12px}
#ctl button{background:#2f3033;color:#d9dadc;border:1px solid #45464a;border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer}
#ctl button:hover{background:#3b3c40}
#ctl label{color:#aeb0b5;font-size:12px;margin-left:8px;display:inline-flex;gap:4px;align-items:center}
#stage{margin:12px auto;position:relative}
#frame{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.5);border-radius:14px}

/* 原稿页示意 */
.scan{position:relative;width:100%;aspect-ratio:210/297;background:var(--scan-bg,#fbf8f0);border:1px solid var(--scan-edge,#d8d3c4);padding:7% 8%;display:flex;flex-direction:column;gap:5%}
.scan-title{display:block;height:5%;width:46%;background:var(--scan-ink,#b9b3a2);opacity:.85;border-radius:1px}
.scan-body{display:flex;flex-direction:column;gap:2.6%;flex:1}
.scan-body i{display:block;height:1.1%;min-height:3px;background:var(--scan-ink,#b9b3a2);opacity:.55;border-radius:1px}
.scan-no{position:absolute;bottom:3%;left:0;right:0;text-align:center;font-size:11px;color:var(--scan-ink,#b9b3a2)}
/* 卡面示意 */
.cardface{aspect-ratio:3/4.2;width:100%;max-width:340px;margin:0 auto;border:1px solid var(--scan-edge,#d8d3c4);background:var(--scan-bg,#fbf8f0);padding:12% 10%;display:flex;flex-direction:column;gap:7%;position:relative}
.cardface b{display:block;height:9%;width:55%;background:var(--scan-ink,#b9b3a2);opacity:.85}
.cardface i{display:block;height:3%;background:var(--scan-ink,#b9b3a2);opacity:.5}
.cardface em{position:absolute;left:0;right:0;bottom:7%;text-align:center;font-style:normal;font-size:12px;color:var(--scan-ink,#b9b3a2)}


/* ===== 方向三「牌桌」：大按钮、一眼看到环节、拇指够得到的底部操作条 =====
   冷灰底＋墨蓝＋信号橙；每个角色一个识别色（按名单顺序取色，不需要新增字段）。 */
#frame{
  --bg:#e7ebee; --card:#ffffff; --ink:#0d1b24; --soft:#41525f; --mut:#5d6c78; --line:#cdd5da; --band:#0d1b24; --on-band:#f2f5f7;
  --acc:#ff5a36; --acc-d:#d63f1d; --acc-ink:#ffffff; --ok:#1c7c54;
  --sans:"PingFang SC","Microsoft YaHei UI","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --serif:"Songti SC","Noto Serif CJK SC","Noto Serif SC","Source Han Serif SC",SimSun,serif;
  --scan-bg:#ffffff; --scan-edge:#c6ced3; --scan-ink:#a3afb8;
  background:var(--bg); color:var(--ink); font:16px/1.6 var(--sans);
}
:where(#frame) button,:where(#frame) textarea,:where(#frame) select,:where(#frame) output{font:inherit}
:where(#frame) button{color:inherit;cursor:pointer;background:none;border:0}
:where(#frame) button:disabled{opacity:.4;cursor:default}
:where(#frame) :focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.d3{display:flex;flex-direction:column;height:100%}

/* 顶部：环节条常驻 */
.strip{flex:none;background:var(--band);color:var(--on-band);display:flex;align-items:center;gap:22px;padding:0 24px;min-height:78px}
.strip .mark{width:38px;height:38px;border-radius:10px;background:var(--acc);color:#fff;display:grid;place-items:center;font:800 20px var(--sans)}
.strip .ph{flex:1;min-width:0}
.strip .ph .line{display:flex;align-items:baseline;gap:12px}
.strip .ph b{font:800 24px/1.2 var(--sans);letter-spacing:.02em}
.strip .ph small{font-size:14px;color:#9fb0bc}
.strip .bars{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:8px;max-width:620px}
.strip .bars i{height:6px;border-radius:3px;background:#2d4150}
.strip .bars i.done{background:#7d93a3}.strip .bars i.current{background:var(--acc)}
.strip .title{font:700 20px var(--sans);letter-spacing:.04em;flex:1}
.strip .me{display:flex;align-items:center;gap:10px}
.chip{min-height:44px;display:inline-flex;align-items:center;padding:0 18px;border-radius:999px;background:var(--h,#fff);color:var(--on,#fff);font:800 18px var(--sans);letter-spacing:.08em}
.strip .out{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid #3a5062;color:#c9d5dd;font-size:15px}
[data-orient="port"] .strip{padding:0 18px;gap:14px}

.main{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto}
.center{margin:auto;text-align:center;max-width:520px;padding:40px}
.center h1{font:800 34px/1.3 var(--sans);margin:0 0 10px}
.lead{font-size:16px;color:var(--soft);line-height:1.8;margin:0}
.dots{display:flex;justify-content:center;gap:10px;margin-bottom:22px}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--acc);animation:b 1.2s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes b{50%{transform:translateY(-10px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none}}

/* 加入页：六张大名牌 */
.join{padding:26px 30px;display:flex;flex-direction:column;gap:20px;flex:1;min-height:0}
.join .top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.join h1{font:800 34px/1.2 var(--sans);margin:0;margin-right:auto}
.addr{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 6px 6px 16px}
.addr output{font-size:16px;color:var(--ink)}
.addr button{background:var(--ink);color:#fff;min-height:46px;padding:0 20px;border-radius:10px;font-weight:700}
.join .lead{margin-top:-8px}
.tiles{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:14px;flex:1;min-height:0}
[data-orient="port"] .tiles{grid-template-columns:repeat(2,1fr)}
.tiles button{width:100%;height:100%;min-height:150px;border-radius:20px;background:var(--h);color:var(--on);padding:18px 22px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;transition:transform .12s;box-shadow:0 6px 0 rgba(13,27,36,.18)}
.tiles button:not(:disabled):active{transform:translateY(4px);box-shadow:0 2px 0 rgba(13,27,36,.18)}
.tiles .n{font:800 44px/1.1 var(--sans);letter-spacing:.06em}
.tiles .s{font-size:15px;font-weight:600;opacity:.92}
.tiles button:disabled{opacity:1;background:repeating-linear-gradient(135deg,#dde3e7 0 10px,#d3dade 10px 20px);color:var(--mut);box-shadow:none}
.warn{color:#c2310f;font-weight:700;font-size:16px;margin:0}

/* 阅读器：白纸一张，两侧是大翻页键 */
.reader{margin:16px 20px 12px;flex:1;min-height:0;background:var(--card);border-radius:20px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 2px 0 var(--line)}
.rtools{display:flex;align-items:center;gap:8px;padding:10px 16px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.rtools .who{font:800 16px var(--sans);margin-right:auto}
.rtools .pg{font-size:14px;color:var(--mut);font-variant-numeric:tabular-nums;margin-right:4px}
.pill{min-width:48px;min-height:46px;padding:0 16px;border-radius:999px;background:#eef1f3;font-size:15px;font-weight:600;color:var(--soft)}
.pill[aria-pressed="true"]{background:var(--ink);color:#fff}
.pill:hover:not([aria-pressed="true"]){background:#e0e6ea}
.set{display:flex;align-items:center;gap:26px;flex-wrap:wrap;padding:12px 16px;background:#f5f7f8;border-bottom:1px solid var(--line)}
.set h2{margin:0;font-size:14px;color:var(--mut);font-weight:600}
.step{display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.step button{width:56px;height:46px;font-weight:700}.step output{min-width:40px;text-align:center;font-weight:700}
.set select{min-height:46px;border-radius:999px;border:1px solid var(--line);background:#fff;padding:0 14px}
.set p{flex-basis:100%;margin:0;font-size:13px;color:var(--mut)}
.stagebox{position:relative;flex:1;min-height:0;display:flex}
.pbox{flex:1;min-width:0;overflow:auto;padding:22px 84px}
.edge{position:absolute;top:0;bottom:0;width:68px;display:grid;place-items:center;font-size:34px;color:var(--ink);z-index:2}
.edge.l{left:0}.edge.r{right:0}
.edge span{width:50px;height:96px;border-radius:14px;background:#eef1f3;display:grid;place-items:center}
.edge:hover:not(:disabled) span{background:var(--acc);color:#fff}
.sw.fitpage{height:100%;display:flex;justify-content:center}.sw.fitpage .sp{height:100%}.sw.fitpage .scan{height:100%;width:auto}
.sw.fitwidth .sp{width:calc(100% * var(--zoom,1))}
.sp{display:grid;gap:12px;margin:0 auto;justify-items:center}.sp.w1{grid-template-columns:1fr}.sp.w2{grid-template-columns:1fr 1fr}
.chnav{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.chnav button{min-height:44px;padding:0 16px;border-radius:999px;border:2px solid var(--line);font-weight:700;font-size:14px;color:var(--soft)}
.chnav [aria-current="location"]{border-color:var(--acc);color:var(--acc-d)}
.tx{margin:0 auto;max-width:calc(var(--bs)*30);column-count:var(--cols);column-gap:3em;column-rule:1px solid var(--line)}
.tx p{font:var(--bs)/var(--lh) var(--serif);margin:0 0 .9em;text-indent:2em;text-align:justify}
.tx h2{font:800 calc(var(--bs)*1.6)/1.4 var(--sans);margin:.3em 0 .8em}
.rfoot{padding:10px 20px 14px;border-top:1px solid var(--line)}
.rfoot .t{display:flex;justify-content:space-between;font-size:14px;gap:12px;flex-wrap:wrap}
.rfoot .t small{font-size:13px;color:var(--mut)}
.prog{height:6px;border-radius:3px;background:#e1e6e9;margin-top:8px;overflow:hidden}.prog i{display:block;height:100%;background:var(--acc)}

/* 线索卡：牌堆 */
.cards{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;padding:22px 24px;flex:1;min-height:0}
[data-orient="port"] .cards{grid-template-columns:1fr}
.cards h2{font:800 26px var(--sans);margin:0 0 4px}
.deck{list-style:none;margin:16px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.deck button{width:100%;aspect-ratio:3/4;border-radius:14px;background:var(--card);border:3px solid transparent;box-shadow:0 4px 0 var(--line);padding:12px;display:flex;flex-direction:column;justify-content:space-between;text-align:left}
.deck button.on{border-color:var(--acc);box-shadow:0 4px 0 var(--acc-d)}
.deck .n{font:800 17px var(--sans)}.deck .s{font-size:13px;color:var(--mut);line-height:1.4}
.deck button.no{background:repeating-linear-gradient(135deg,#dde3e7 0 8px,#d3dade 8px 16px);box-shadow:none;opacity:1}
.deck button.no .s{color:#8f2a10;font-weight:600}
.viewer{background:var(--card);border-radius:20px;padding:20px;display:grid;place-items:center;align-content:center;min-height:360px;box-shadow:0 2px 0 var(--line)}
.viewer figcaption{font-size:13px;color:var(--mut);margin-top:12px;text-align:center}

/* 公共对话 */
.pub{display:flex;flex-direction:column;flex:1;min-height:0}
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 24px 0}
.ctrls button{min-height:46px;padding:0 18px;border-radius:12px;background:#d8dfe3;color:#6a7983;font-weight:700}
.ctrls button:disabled{opacity:1}
.ctrls .note{font-size:14px;color:var(--mut);margin-left:6px}
.facts{display:flex;gap:10px;flex-wrap:wrap;padding:12px 24px 0;align-items:center}
.fact{font-size:14px;color:var(--soft);background:var(--card);border-radius:999px;padding:6px 14px;border:1px solid var(--line)}
.hintbar{margin:12px 24px 0;font-size:16px;color:var(--soft)}
.reveal{margin:12px 24px 0;padding:14px 18px;border-radius:14px;background:var(--ink);color:#fff;font:17px/1.8 var(--serif)}
.reveal p{margin:0}
.fs{flex:1;min-height:0;overflow:auto;padding:16px 24px}
ol.feed{list-style:none;margin:0 auto;padding:0;max-width:760px;display:flex;flex-direction:column;gap:12px}
.feed li{font-size:17px;line-height:1.75;max-width:80%;padding:12px 18px;border-radius:20px}
.feed li.host{align-self:flex-start;background:var(--card);border-bottom-left-radius:6px;box-shadow:0 2px 0 var(--line)}
.feed li.player{align-self:flex-end;background:var(--acc);color:var(--acc-ink);border-bottom-right-radius:6px;font-weight:600}
.feed li.event{align-self:center;max-width:100%;font-size:13px;font-weight:700;color:var(--mut);padding:2px 14px;border:1px solid var(--line);border-radius:999px}
.foldbtn.fold{display:none}
[data-orient="port"] .foldbtn.fold{display:flex}
[data-orient="port"] .full-ctrls{display:none}
[data-orient="port"] .pub.open .full-ctrls{display:block}
.foldbtn{margin:12px 24px 0;min-height:48px;padding:0 18px;border-radius:12px;background:var(--card);border:1px solid var(--line);width:calc(100% - 48px);display:flex;justify-content:space-between;align-items:center;font-weight:700}

/* 底部操作条：导航＋发言 */
.dock{flex:none;background:var(--card);border-top:1px solid var(--line);padding:10px 16px 8px;position:relative}
.dock .row{display:flex;gap:10px;align-items:stretch}
.dock .tabs{display:flex;gap:8px}
.dock .tabs button{min-width:132px;min-height:56px;border-radius:16px;background:#eef1f3;font-weight:800;font-size:16px}
.dock .tabs button[aria-current="page"]{background:var(--ink);color:#fff}
.dock textarea{flex:1;min-width:0;resize:none;min-height:56px;border-radius:16px;border:2px solid var(--line);padding:12px 16px;font:16px/1.5 var(--sans);background:#f7f9fa;color:var(--ink)}
.dock textarea:focus{border-color:var(--acc);outline:none;background:#fff}
.dock textarea:disabled{opacity:.55}
.dock .go{min-width:92px;min-height:56px;border-radius:16px;background:var(--acc);color:var(--acc-ink);font-weight:800;font-size:17px}
.dock .go:disabled{background:#dfe5e8;color:var(--mut);opacity:1}
.dock .stop{min-height:56px;padding:0 16px;border-radius:16px;border:2px solid #c2310f;color:#c2310f;font-weight:700}
.dock .tg{min-height:56px;padding:0 16px;border-radius:16px;border:2px solid var(--line);font-weight:700;color:var(--soft)}
.dock .h{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin:4px 4px 0;min-height:20px;padding-left:0}
.dock .h.err{color:#c2310f;font-weight:700}
.dock .panel{position:absolute;left:16px;right:16px;bottom:100%;margin-bottom:8px;background:var(--card);border-radius:18px;box-shadow:0 -6px 30px rgba(13,27,36,.22);padding:14px 18px;list-style:none;display:flex;flex-direction:column;gap:6px;max-height:300px;overflow:auto;margin-top:0}
.dock .panel li{font-size:15px;line-height:1.7}.dock .panel li.event{font-size:13px;color:var(--mut)}.dock .panel li.player{color:var(--acc-d);font-weight:600}
[data-orient="port"] .dock .row.nav{margin-bottom:8px}
[data-orient="port"] .dock .tabs{flex:1}
[data-orient="port"] .dock .tabs button{flex:1;min-width:0}
</style>
</head>
<body>
<script>
/* ===== 共用示意数据与交互（三个方向共用，只换外观与骨架）=====
   全部是示意数据，不来自任何真实剧本。公开消息只有 kind + text 两个字段，角色只有名字与是否已认领。 */
const DATA = {
  roles: ['林白', '周望', '沈知', '顾青', '许然', '陈默'],
  othersClaimed: ['周望', '顾青'],
  me: '沈知',
  storyTitle: '示意剧本',
  address: 'http://192.168.1.23:5280',
  phases: ['开场', '自我介绍', '第一轮搜证', '集中讨论', '投票', '揭秘'],
  hints: { 2: '本环节可以互相交换信息，卡面只在各自设备上显示。', 4: '请在纸上写下你的选择，由主持人汇总。' },
  chapters: ['序章', '第一幕', '第二幕'],
  pages: [
    { ch: 0, blocks: [['h', '序章'], ['p', '雨从傍晚开始下。你站在门廊里，把伞收起来，听见屋里有人压低了声音说话，像是怕被谁听见。'], ['p', '这是示意正文：真实角色本在这里按你设定的字号与行距重新分页，翻页时位置会被记住。']] },
    { ch: 0, blocks: [['p', '你把外套搭在椅背上，注意到桌上的杯子还是温的。这一段只用来展示正文的行距、缩进与两端对齐。'], ['p', '换行之后的第二段同样是示意文字。宋体长文适合连续阅读，界面控件则保持无衬线。']] },
    { ch: 1, blocks: [['h', '第一幕'], ['p', '示意：第一幕的开头。标题与正文之间留出足够的空白，让眼睛有地方落脚。'], ['p', '这里同样是示意文字，用来观察一整页正文在不同字号下的疏密。']] },
    { ch: 1, blocks: [['p', '章节中间的一页。页码和章节名放在页脚，随时能看到自己读到了哪里。'], ['p', '示意文字，没有任何剧情内容。']] },
    { ch: 2, blocks: [['h', '第二幕'], ['p', '示意：第二幕的开头。识别文字可能有误，以原稿为准，这句提示常驻页脚。']] },
  ],
  srcPageCount: 12,
  cards: [
    { name: '线索卡 1', group: 'A 组', order: '第 1 张', ok: true },
    { name: '线索卡 2', group: 'A 组', order: '第 2 张', ok: true },
    { name: '线索卡 3', group: 'B 组', order: '第 1 张', ok: false, why: '这一组少正面，暂停分发' },
    { name: '线索卡 4', group: 'B 组', order: '第 2 张', ok: false, why: '切片还没确认，暂停分发' },
    { name: '线索卡 5', group: 'C 组', order: '第 1 张', ok: true },
    { name: '线索卡 6', group: 'C 组', order: '第 2 张', ok: true },
  ],
  feed: [
    ['event', '第 3 环节开始：第一轮搜证'],
    ['host', '现在进入搜证环节。请各位翻看自己的线索，需要放出的材料我会在电脑上点出。'],
    ['player', '我想先确认一下，这一环节能互相看手里的卡吗？'],
    ['host', '可以口头交流，但卡面只在各自设备上显示。'],
    ['player', '好，那我先说我这边的发现。'],
    ['event', '材料已放出：线索组 A'],
  ],
};

const SIZES = { land: [1180, 820, '平板横屏 1180×820'], port: [820, 1180, '平板竖屏 820×1180'], droid: [800, 1280, '安卓竖屏 800×1280'] };

const S = {
  screen: 'join', role: null, size: 'land', phase: 2, claimFail: false, copied: false, copyFail: false,
  mode: 'src', cols: 1, fit: 'width', zoom: 1, settings: false, focus: false, font: 20, spacing: 'relaxed',
  page: 0, srcPage: 3, cardSel: 0, panel: false, draft: '', notice: '', err: false,
  busy: false, speaking: false, simSendFail: false, extra: [],
};

const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const $ = (s, r = document) => r.querySelector(s);

/* 派生状态 */
const taken = (n) => DATA.othersClaimed.includes(n);
const feedAll = () => DATA.feed.concat(S.extra);
const phaseStatus = (i) => (i < S.phase ? 'done' : i === S.phase ? 'current' : 'upcoming');
const phaseOneLine = () => `${DATA.phases[S.phase]} · 第 ${S.phase + 1}/${DATA.phases.length} 环节`;
const controlLabels = () => (S.phase >= 4 ? ['确认提交汇总', '揭秘', '进入复盘', '暂停'] : ['结束搜证', '放出下一批材料', '暂停']);
const materialMeta = () => (S.phase === 2 ? '待放出材料 2 · 已放出 3' : '待放出材料 0 · 已放出 5');
const voteMeta = () => (S.phase >= 4 ? '投票汇总：林白 2 票，周望 1 票 · 共 3 票' : '');
const revealTexts = () => (S.phase === 5 ? ['（揭秘文本示意：主持人公开揭秘的文字显示在这里。）'] : []);
const hintText = () => DATA.hints[S.phase] || '';
const controlsNote = '请在电脑上操作';
const srcStep = () => S.cols;
const srcEnd = () => Math.min(S.srcPage + S.cols - 1, DATA.srcPageCount);
const srcLabel = () => (S.srcPage === srcEnd() ? `${S.srcPage}` : `${S.srcPage}～${srcEnd()}`);
const curPage = () => DATA.pages[S.page];
const chapterOf = () => curPage().ch;
const speech = () => {
  const hasRole = !!S.role;
  const hint = !hasRole ? '请先认领角色' : S.busy ? '主持正在回应' : S.notice;
  return {
    hasRole, canSend: hasRole && !S.busy && S.draft.trim().length > 0, hint, err: S.err && hasRole && !S.busy,
    count: S.draft.length, max: 300,
  };
};

/* 原稿页示意：纯 CSS 画出一页扫描件，不使用任何真实卡图或角色本 */
function scanPage(n) {
  let seed = n * 9301 + 49297;
  const rnd = () => ((seed = (seed * 9301 + 49297) % 233280) / 233280);
  const lines = Array.from({ length: 15 }, () => `<i style="width:${Math.round(58 + rnd() * 40)}%"></i>`).join('');
  return `<div class="scan"><b class="scan-title"></b><div class="scan-body">${lines}</div><span class="scan-no">${n}</span></div>`;
}
const cardFace = (c) => `<div class="cardface"><b></b><i></i><i></i><i style="width:60%"></i><em>卡面示意 · ${esc(c.name)}</em></div>`;

/* 共用的页面素材 */
function textPageHTML() {
  return curPage().blocks.map(([k, t]) => (k === 'h' ? `<h2 class="chapter">${esc(t)}</h2>` : `<p class="para">${esc(t)}</p>`)).join('');
}
const spacingValue = () => ({ tight: 1.6, relaxed: 1.95, loose: 2.3 }[S.spacing]);

/* ===== 行为 ===== */
let RENDER = null;
function patch(o) { Object.assign(S, o); redo(); }
function act(name, arg) {
  const total = DATA.pages.length;
  switch (name) {
    case 'go': S.screen = arg; S.panel = false; break;
    case 'claim':
      if (taken(arg)) { S.claimFail = true; break; }
      S.role = arg; S.claimFail = false; S.screen = 'book'; break;
    case 'release': S.role = null; S.screen = 'join'; S.panel = false; break;
    case 'copy':
      S.copied = true; S.copyFail = false;
      try { navigator.clipboard && navigator.clipboard.writeText(DATA.address); } catch (e) { /* 预览里复制失败不影响演示 */ }
      break;
    case 'mode': S.mode = arg; S.settings = false; break;
    case 'cols': S.cols = S.cols === 1 ? 2 : 1; break;
    case 'fit': S.fit = S.fit === 'width' ? 'page' : 'width'; S.zoom = 1; break;
    case 'zoom': S.fit = 'width'; S.zoom = Math.min(3, Math.max(0.5, S.zoom + Number(arg))); break;
    case 'settings': S.settings = !S.settings; break;
    case 'focus': S.focus = !S.focus; break;
    case 'font': S.font = Math.min(30, Math.max(16, S.font + Number(arg))); break;
    case 'spacing': S.spacing = arg; break;
    case 'turn':
      if (S.mode === 'src') S.srcPage = Math.min(DATA.srcPageCount, Math.max(1, S.srcPage + Number(arg) * srcStep()));
      else S.page = Math.min(total - 1, Math.max(0, S.page + Number(arg)));
      break;
    case 'chapter': S.page = DATA.pages.findIndex((p) => p.ch === Number(arg)); break;
    case 'card': S.cardSel = Number(arg); break;
    case 'panel': S.panel = !S.panel; break;
    case 'rail': S.rail = !S.rail; break;
    case 'send': {
      const m = speech();
      if (!m.canSend) break;
      if (S.simSendFail) { S.err = true; S.notice = '没有发出去：主持暂时没有回应，请再试一次'; break; }
      S.extra.push(['player', S.draft.trim()]); S.draft = ''; S.err = false; S.notice = '已发给大家'; break;
    }
    case 'stop': S.speaking = false; break;
  }
  if (name === 'copy') setTimeout(() => { S.copied = false; redo(); }, 2500);
  redo();
}

function redo() {
  const f = $('#frame');
  const had = document.activeElement && document.activeElement.id === 'speech-input';
  const feedEl = $('.feed-scroll', f);
  const keep = feedEl ? feedEl.scrollTop : 0;
  f.dataset.size = S.size;
  f.dataset.orient = S.size === 'land' ? 'land' : 'port';
  f.innerHTML = RENDER(S);
  const ta = $('#speech-input', f);
  if (ta) { ta.value = S.draft; if (had) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); } }
  const nf = $('.feed-scroll', f);
  if (nf) nf.scrollTop = keep || nf.scrollHeight;
  fit();
}

function fit() {
  const [w, h] = SIZES[S.size];
  const f = $('#frame'); const st = $('#stage');
  const ctl = $('#ctl').offsetHeight;
  const sc = Math.min((innerWidth - 24) / w, (innerHeight - ctl - 20) / h, 1);
  f.style.width = w + 'px'; f.style.height = h + 'px'; f.style.transform = `scale(${sc})`;
  st.style.width = w * sc + 'px'; st.style.height = h * sc + 'px';
}

/* 预览控制条：只在预览页里存在，不属于设计本身 */
const CHIPS = [
  ['wait', '等待选剧本', { screen: 'wait', role: null }],
  ['prep', '材料准备中', { screen: 'prep', role: null }],
  ['join', '加入页', { screen: 'join', role: null, claimFail: false }],
  ['joinf', '认领失败', { screen: 'join', role: null, claimFail: true }],
  ['src', '角色本·原稿', { screen: 'book', role: DATA.me, mode: 'src', settings: false, panel: false }],
  ['txt', '角色本·文字', { screen: 'book', role: DATA.me, mode: 'text', settings: false, panel: false }],
  ['set', '字号设置', { screen: 'book', role: DATA.me, mode: 'text', settings: true, panel: false }],
  ['cards', '线索卡', { screen: 'cards', role: DATA.me, panel: false }],
  ['pub', '公共·搜证', { screen: 'public', role: DATA.me, phase: 2, panel: false }],
  ['vote', '公共·投票', { screen: 'public', role: DATA.me, phase: 4, panel: false }],
  ['rev', '公共·揭秘', { screen: 'public', role: DATA.me, phase: 5, panel: false }],
  ['panel', '阅读时开对话', { screen: 'book', role: DATA.me, mode: 'src', panel: true }],
];

function mount(render, title) {
  RENDER = render;
  document.title = title;
  const chips = CHIPS.map(([id, label, p]) => `<button data-chip="${id}">${label}</button>`).join('');
  const sizes = Object.entries(SIZES).map(([k, v]) => `<button data-size="${k}">${v[2]}</button>`).join('');
  document.body.insertAdjacentHTML('afterbegin', `
    <div id="ctl"><div class="row"><strong>${esc(title)}</strong><span class="note">示意数据 · 预览控制条不属于设计</span></div>
    <div class="row">${chips}</div>
    <div class="row">${sizes}<label><input type="checkbox" data-flag="busy"> 主持正在回应</label><label><input type="checkbox" data-flag="speaking"> 主持朗读中</label><label><input type="checkbox" data-flag="simSendFail"> 发送出错</label></div></div>
    <div id="stage"><div id="frame"></div></div>`);
  document.addEventListener('click', (e) => {
    const c = e.target.closest('[data-chip]');
    if (c) { patch(CHIPS.find((x) => x[0] === c.dataset.chip)[2]); return; }
    const z = e.target.closest('#ctl [data-size]');
    if (z) { patch({ size: z.dataset.size }); return; }
    const a = e.target.closest('#frame [data-act]');
    if (a && !a.disabled) act(a.dataset.act, a.dataset.arg);
  });
  document.addEventListener('change', (e) => {
    const f = e.target.dataset.flag;
    if (f) { S[f] = e.target.checked; if (f === 'simSendFail' && !S.simSendFail) { S.err = false; S.notice = ''; } redo(); }
    if (e.target.dataset.spacing !== undefined) act('spacing', e.target.value);
  });
  document.addEventListener('input', (e) => {
    if (e.target.id !== 'speech-input') return;
    S.draft = e.target.value;
    const m = speech();
    const send = $('#frame [data-act="send"]'); if (send) send.disabled = !m.canSend;
    const cnt = $('#frame .speech-count'); if (cnt) cnt.textContent = `${m.count}/${m.max}`;
  });
  addEventListener('resize', fit);
  redo();
}


const HUES = [['#e4572e', '#fff'], ['#1f7a9d', '#fff'], ['#3f8a3a', '#fff'], ['#a64d79', '#fff'], ['#f2b705', '#0d1b24'], ['#42487a', '#fff']];
const hueOf = (name) => HUES[Math.max(0, DATA.roles.indexOf(name)) % HUES.length];
const hueStyle = (name) => { const [h, on] = hueOf(name); return `--h:${h};--on:${on}`; };

function strip(s) {
  if (!s.role) return `<header class="strip"><span class="mark" aria-hidden="true">局</span><span class="title">本局主持 · 平板</span></header>`;
  return `<header class="strip"><span class="mark" aria-hidden="true">局</span>
    <div class="ph"><div class="line"><b>${DATA.phases[s.phase]}</b><small>第 ${s.phase + 1}/${DATA.phases.length} 环节</small></div>
    <div class="bars" aria-label="本局进度">${DATA.phases.map((p, i) => `<i class="${phaseStatus(i)}" title="${p}"></i>`).join('')}</div></div>
    <div class="me"><span class="chip" style="${hueStyle(s.role)}">${esc(s.role)}</span><button class="out" data-act="release">退出重选</button></div></header>`;
}

const TABS = [['book', '我的角色本'], ['cards', '全部线索卡'], ['public', '公共对话']];
function dock(s) {
  const m = speech();
  const showToggle = s.screen !== 'public' && s.role;
  const port = s.size !== 'land';
  const recent = feedAll().slice(-8);
  const panel = s.panel && showToggle ? `<ol class="panel">${recent.map(([k, t]) => `<li class="${k}">${esc(t)}</li>`).join('')}</ol>` : '';
  const tabs = s.role ? `<nav class="tabs" aria-label="平板功能">${TABS.map(([id, l]) => `<button data-act="go" data-arg="${id}" ${s.screen === id ? 'aria-current="page"' : ''}>${l}</button>`).join('')}</nav>` : '';
  const input = `<textarea id="speech-input" rows="1" maxlength="300" placeholder="对大家说点什么…" ${m.hasRole ? '' : 'disabled'}></textarea>
    ${s.speaking ? '<button class="stop" data-act="stop">停止朗读</button>' : ''}${showToggle ? `<button class="tg" data-act="panel">${s.panel ? '收起' : '对话'}</button>` : ''}
    <button class="go" data-act="send" ${m.canSend ? '' : 'disabled'}>发送</button>`;
  const hint = `<p class="h ${m.err ? 'err' : ''}"><span>${esc(m.hint)}</span><span class="speech-count">${m.count}/${m.max}</span></p>`;
  if (port && s.role) return `<footer class="dock">${panel}<div class="row nav">${tabs}</div><div class="row">${input}</div>${hint}</footer>`;
  return `<footer class="dock">${panel}<div class="row">${tabs}${input}</div>${hint}</footer>`;
}

function joinScreen(s) {
  return `<section class="join"><div class="top"><h1>加入本局</h1><div class="addr"><output>${esc(DATA.address)}</output><button data-act="copy">${s.copied ? '已复制' : '复制'}</button></div></div>
    <p class="lead">与电脑连接同一 Wi-Fi 后打开本页即可，也可以扫描电脑上的二维码。选一个角色开始阅读；已被别人认领的角色不能再选。</p>
    <ul class="tiles">${DATA.roles.map((r) => `<li><button data-act="claim" data-arg="${r}" style="${hueStyle(r)}" ${taken(r) ? 'disabled' : ''}><span class="n">${r}</span><span class="s">${taken(r) ? '已被认领' : '点一下认领'}</span></button></li>`).join('')}</ul>
    ${s.claimFail ? '<p class="warn">这个角色刚被别人认领了，请另选一个。</p>' : ''}</section>`;
}

function reader(s) {
  const src = s.mode === 'src';
  const total = src ? DATA.srcPageCount : DATA.pages.length;
  const label = src ? srcLabel() : s.page + 1;
  const prevOff = src ? s.srcPage <= 1 : s.page <= 0;
  const nextOff = src ? srcEnd() >= DATA.srcPageCount : s.page >= total - 1;
  const pos = src ? s.srcPage / total : (s.page + 1) / total;
  const settings = s.settings && !src ? `<div class="set"><h2>按你的习惯阅读</h2>
    <div class="step"><button data-act="font" data-arg="-1" aria-label="减小字号" ${s.font <= 16 ? 'disabled' : ''}>A−</button><output>${s.font}</output><button data-act="font" data-arg="1" aria-label="增大字号" ${s.font >= 30 ? 'disabled' : ''}>A＋</button></div>
    <label>行间留白 <select data-spacing>${[['tight', '紧凑'], ['relaxed', '舒展'], ['loose', '宽松']].map(([v, l]) => `<option value="${v}" ${s.spacing === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
    <p>字号和屏幕变化后按文本位置重新分页。阅读器页码与原稿页码不同。</p></div>` : '';
  let body;
  if (src) {
    const pages = []; for (let p = s.srcPage; p <= srcEnd(); p++) pages.push(scanPage(p));
    body = `<div class="pbox"><div class="sw ${s.fit === 'page' ? 'fitpage' : 'fitwidth'}" style="--zoom:${s.zoom}"><div class="sp w${pages.length}">${pages.join('')}</div></div></div>`;
  } else {
    body = `<div class="pbox" style="--bs:${s.font}px;--lh:${spacingValue()};--cols:${s.cols}">
      <nav class="chnav" aria-label="角色本章节">${DATA.chapters.map((c, i) => `<button data-act="chapter" data-arg="${i}" ${i === chapterOf() ? 'aria-current="location"' : ''}>${c}</button>`).join('')}</nav>
      <article class="tx" tabindex="0" aria-label="当前页正文">${textPageHTML()}</article></div>`;
  }
  const foot = src ? [`原稿 · 第 ${label} / ${total} 页`, '可缩放查看'] : [`第 ${chapterOf() + 1} 章 · ${DATA.chapters[chapterOf()]}`, '识别文字可能有误，以原稿为准'];
  return `<section class="reader"><div class="rtools"><span class="who">${esc(s.role)}</span><span class="pg">第 ${label} / ${total} 页</span>
    <button class="pill" data-act="mode" data-arg="src" aria-pressed="${src}">原稿</button><button class="pill" data-act="mode" data-arg="text" aria-pressed="${!src}">文字重排</button>
    <button class="pill" data-act="cols">${s.cols === 1 ? '双栏' : '单栏'}</button>
    ${src ? `<button class="pill" data-act="fit">${s.fit === 'page' ? '适合宽度' : '整页'}</button><button class="pill" aria-label="缩小原稿" data-act="zoom" data-arg="-0.25" ${s.zoom <= 0.5 ? 'disabled' : ''}>−</button><button class="pill" aria-label="放大原稿" data-act="zoom" data-arg="0.25" ${s.zoom >= 3 ? 'disabled' : ''}>＋</button>`
      : `<button class="pill" data-act="settings" aria-expanded="${s.settings}">Aa</button>`}
    <button class="pill" data-act="focus">${s.focus ? '退出专注' : '专注'}</button></div>${settings}
    <div class="stagebox"><button class="edge l" data-act="turn" data-arg="-1" aria-label="上一页" ${prevOff ? 'disabled' : ''}><span>‹</span></button>${body}<button class="edge r" data-act="turn" data-arg="1" aria-label="下一页" ${nextOff ? 'disabled' : ''}><span>›</span></button></div>
    <footer class="rfoot"><div class="t"><span>${foot[0]}</span><small>${foot[1]}</small></div><div class="prog"><i style="width:${Math.round(pos * 100)}%"></i></div></footer></section>`;
}

function cardsScreen(s) {
  const c = DATA.cards[s.cardSel];
  return `<section class="cards"><div><h2>全部线索卡</h2><p class="lead">点哪张看哪张，只在这台设备上显示。暂停分发的组用纸质卡。</p>
    <ul class="deck">${DATA.cards.map((k, i) => k.ok
      ? `<li><button class="${i === s.cardSel ? 'on' : ''}" data-act="card" data-arg="${i}"><span class="n">${k.name}</span><span class="s">${k.group}<br>${k.order}</span></button></li>`
      : `<li><button class="no" disabled><span class="n">${k.name}</span><span class="s">${k.group} · ${k.order}<br>${k.why}，请用纸质卡</span></button></li>`).join('')}</ul></div>
    <figure class="viewer" style="margin:0"><div style="width:100%">${cardFace(c)}<figcaption>线索卡 · 正面（示意）</figcaption></div></figure></section>`;
}

function publicScreen(s) {
  const reveal = revealTexts();
  const ctrls = `<div class="ctrls">${controlLabels().map((l) => `<button disabled>${l}</button>`).join('')}<span class="note">${controlsNote}</span></div>
    <div class="facts"><span class="fact">${materialMeta()}</span>${voteMeta() ? `<span class="fact">${voteMeta()}</span>` : ''}</div>`;
  return `<section class="pub ${s.rail ? 'open' : ''}">
    <button class="foldbtn fold" data-act="rail" aria-expanded="${!!s.rail}"><span>${phaseOneLine()}</span><span>${s.rail ? '收起' : '展开主持按钮'}</span></button>
    <div class="full-ctrls">${ctrls}</div>
    ${hintText() ? `<p class="hintbar">${hintText()}</p>` : ''}
    ${reveal.length ? `<div class="reveal">${reveal.map((t) => `<p>${t}</p>`).join('')}</div>` : ''}
    <div class="fs"><ol class="feed">${feedAll().map(([k, t]) => `<li class="${k}">${esc(t)}</li>`).join('')}</ol></div></section>`;
}

function render(s) {
  let main;
  if (s.screen === 'wait') main = '<section class="center"><div class="dots"><i></i><i></i><i></i></div><h1>等待主持人选剧本</h1><p class="lead">电脑一打开剧本，这里会自动变成选角色页，不用刷新。</p></section>';
  else if (s.screen === 'prep') main = `<section class="center"><div class="dots"><i></i><i></i><i></i></div><h1>材料准备中</h1><p class="lead">《${DATA.storyTitle}》的卡片正在准备，几秒后自动开始。</p></section>`;
  else if (s.screen === 'join' || !s.role) main = joinScreen(s);
  else if (s.screen === 'book') main = reader(s);
  else if (s.screen === 'cards') main = cardsScreen(s);
  else main = publicScreen(s);
  return `<div class="d3">${strip(s)}<main class="main">${main}</main>${dock(s)}</div>`;
}
mount(render, '方向三 · 牌桌');
</script>
</body>
</html>
