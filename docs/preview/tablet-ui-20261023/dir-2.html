<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方向二 · 暗室</title>
<style>
/* 预览控制条与共用素材（不属于设计本身） */
*{box-sizing:border-box}
html,body{margin:0;background:#2b2c2e;font:13px/1.4 "Microsoft YaHei UI","Microsoft YaHei","PingFang SC",sans-serif;color:#d9dadc}
#ctl{position:sticky;top:0;z-index:50;background:#1d1e20;border-bottom:1px solid #3a3b3e;padding:8px 12px;display:flex;flex-direction:column;gap:6px}
#ctl .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#ctl strong{font-size:14px;color:#fff;margin-right:8px}
#ctl .note{color:#8d9096;font-size:12px}
#ctl button{background:#2f3033;color:#d9dadc;border:1px solid #45464a;border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer}
#ctl button:hover{background:#3b3c40}
#ctl label{color:#aeb0b5;font-size:12px;margin-left:8px;display:inline-flex;gap:4px;align-items:center}
#stage{margin:12px auto;position:relative}
#frame{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.5);border-radius:14px}

/* 原稿页示意 */
.scan{position:relative;width:100%;aspect-ratio:210/297;background:var(--scan-bg,#fbf8f0);border:1px solid var(--scan-edge,#d8d3c4);padding:7% 8%;display:flex;flex-direction:column;gap:5%}
.scan-title{display:block;height:5%;width:46%;background:var(--scan-ink,#b9b3a2);opacity:.85;border-radius:1px}
.scan-body{display:flex;flex-direction:column;gap:2.6%;flex:1}
.scan-body i{display:block;height:1.1%;min-height:3px;background:var(--scan-ink,#b9b3a2);opacity:.55;border-radius:1px}
.scan-no{position:absolute;bottom:3%;left:0;right:0;text-align:center;font-size:11px;color:var(--scan-ink,#b9b3a2)}
/* 卡面示意 */
.cardface{aspect-ratio:3/4.2;width:100%;max-width:340px;margin:0 auto;border:1px solid var(--scan-edge,#d8d3c4);background:var(--scan-bg,#fbf8f0);padding:12% 10%;display:flex;flex-direction:column;gap:7%;position:relative}
.cardface b{display:block;height:9%;width:55%;background:var(--scan-ink,#b9b3a2);opacity:.85}
.cardface i{display:block;height:3%;background:var(--scan-ink,#b9b3a2);opacity:.5}
.cardface em{position:absolute;left:0;right:0;bottom:7%;text-align:center;font-style:normal;font-size:12px;color:var(--scan-ink,#b9b3a2)}


/* ===== 方向二「暗室」：夜里围桌玩，屏幕不刺眼；横屏左边读、右边看公共对话 =====
   深底单点缀（琥珀）。正文衬线，控件无衬线，全部系统字体、离线可用。 */
#frame{
  --bg:#0e1210; --sf:#151a17; --raise:#1d2420; --line:#2b342f; --ink:#e9e5d9; --soft:#b9b5a8; --mut:#8d9389;
  --amber:#e3a94d; --amber-ink:#1b1306; --amber-dim:rgba(227,169,77,.14); --red:#e58a7b;
  --serif:"Songti SC","Noto Serif CJK SC","Noto Serif SC","Source Han Serif SC",SimSun,serif;
  --sans:"PingFang SC","Microsoft YaHei UI","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --scan-bg:#d6d1c1; --scan-edge:#5c594e; --scan-ink:#8b8676;
  background:var(--bg); color:var(--ink); font:16px/1.6 var(--sans); color-scheme:dark;
}
:where(#frame) button,:where(#frame) textarea,:where(#frame) select,:where(#frame) output{font:inherit}
:where(#frame) button{color:inherit;cursor:pointer;background:none;border:0}
:where(#frame) button:disabled{opacity:.4;cursor:default}
:where(#frame) :focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.d2{display:grid;grid-template-columns:92px 1fr;height:100%}
[data-orient="port"] .d2{grid-template-columns:1fr;grid-template-rows:1fr auto}

/* 导航栏：横屏在左，竖屏沉到底部，拇指够得到 */
.nav{background:var(--sf);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px}
.nav .mark{width:40px;height:40px;border:1.5px solid var(--amber);color:var(--amber);display:grid;place-items:center;font:500 20px var(--serif);margin-bottom:14px}
.nav button.it{width:76px;min-height:72px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--mut);font-size:13px}
.nav button.it svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button.it[aria-current="page"]{background:var(--amber-dim);color:var(--amber)}
.nav .sp{flex:1}
.nav .me{writing-mode:vertical-rl;letter-spacing:.2em;font:600 17px/1 var(--serif);color:var(--amber);border:1px solid var(--amber);padding:10px 6px;border-radius:6px;margin-bottom:6px}
.nav .out{font-size:13px;color:var(--mut);min-height:44px;padding:0 6px;border-radius:8px}
[data-orient="port"] .nav{grid-row:2;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:8px 14px;gap:8px;justify-content:space-between}
[data-orient="port"] .nav .mark,[data-orient="port"] .nav .sp{display:none}
[data-orient="port"] .nav button.it{flex:1;width:auto;min-width:0;min-height:60px;flex-direction:row;gap:8px;font-size:15px;padding:0 4px}
[data-orient="port"] .nav .me{writing-mode:horizontal-tb;letter-spacing:.1em;padding:6px 12px;margin:0}
[data-orient="port"] .nav .out{padding:0 4px;white-space:nowrap}

.stage{display:grid;grid-template-columns:1fr;min-width:0;min-height:0}
.stage.with-side{grid-template-columns:1fr 340px}
[data-orient="port"] .stage.with-side{grid-template-columns:1fr}
.col{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.scroll{flex:1;min-height:0;overflow:auto}
.center{margin:auto;text-align:center;max-width:520px;padding:40px}
.center h1{font:500 32px/1.4 var(--serif);margin:0 0 10px}
.lead{font-size:16px;color:var(--soft);line-height:1.85;margin:0}
.ring{width:56px;height:56px;border-radius:50%;border:2px solid var(--amber);margin:0 auto 22px;animation:p 2.4s ease-in-out infinite}
@keyframes p{50%{transform:scale(1.18);opacity:.4}}
@media (prefers-reduced-motion:reduce){.ring{animation:none}}

/* 加入页 */
.join{padding:40px 44px;display:flex;flex-direction:column;gap:26px;margin:auto 0}
.join h1{font:500 36px/1.3 var(--serif);margin:0}
.addr{display:flex;align-items:center;gap:12px;background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:10px 10px 10px 18px;flex-wrap:wrap}
.addr .k{font-size:13px;color:var(--mut)}
.addr output{flex:1;min-width:200px;font:17px var(--sans);letter-spacing:.02em;color:var(--ink)}
.addr button{background:var(--amber);color:var(--amber-ink);min-height:48px;padding:0 24px;border-radius:9px;font-weight:600}
.roles{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
[data-orient="port"] .roles{grid-template-columns:repeat(2,1fr)}
.roles button{width:100%;min-height:118px;padding:18px 20px;text-align:left;background:var(--sf);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;justify-content:space-between}
.roles button:not(:disabled):hover{border-color:var(--amber)}
.roles button:not(:disabled):active{transform:scale(.985)}
.roles .n{font:500 28px/1.2 var(--serif);letter-spacing:.08em}
.roles .s{font-size:14px;color:var(--amber)}
.roles button:disabled{opacity:1;color:var(--mut);background:transparent;border-style:dashed}
.roles button:disabled .s{color:var(--mut)}
.warn{color:var(--red);font-size:15px;margin:0}

/* 阅读器 */
.rd{flex:1;min-height:0;display:flex;flex-direction:column}
.rtools{display:flex;align-items:center;gap:6px;padding:10px 20px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.rtools .who{font:500 15px var(--serif);color:var(--mut);letter-spacing:.1em;margin-right:auto}
.rtools .pg{font-size:14px;color:var(--mut);font-variant-numeric:tabular-nums;margin-right:4px}
.seg{display:flex;background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{min-height:40px;padding:0 14px;border-radius:7px;font-size:15px;color:var(--soft)}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--amber);font-weight:600}
.pill{min-width:44px;min-height:44px;padding:0 14px;border-radius:10px;font-size:15px;color:var(--soft)}
.pill:hover{background:var(--raise)}
.set{display:flex;align-items:center;gap:26px;flex-wrap:wrap;padding:12px 20px;background:var(--sf);border-bottom:1px solid var(--line)}
.set h2{margin:0;font-size:14px;color:var(--mut);font-weight:500}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px}
.step button{width:50px;height:44px}.step output{min-width:40px;text-align:center}
.set select{min-height:44px;background:var(--raise);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:0 10px}
.set p{flex-basis:100%;margin:0;font-size:13px;color:var(--mut)}
.page{flex:1;min-height:0;overflow:auto;padding:22px 28px;position:relative}
.page .sw.fitpage{height:100%;display:flex;justify-content:center}
.page .sw.fitpage .sp2{height:100%}.page .sw.fitpage .scan{height:100%;width:auto}
.page .sw.fitwidth .sp2{width:calc(100% * var(--zoom,1))}
.sp2{display:grid;gap:12px;margin:0 auto;justify-items:center}.sp2.w1{grid-template-columns:1fr}.sp2.w2{grid-template-columns:1fr 1fr}
.scan{filter:brightness(.92)}
.chnav{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.chnav button{min-height:44px;padding:0 14px;border-radius:999px;font-size:14px;color:var(--soft);border:1px solid var(--line)}
.chnav [aria-current="location"]{border-color:var(--amber);color:var(--amber)}
.tx{margin:0 auto;max-width:calc(var(--bs)*30);column-count:var(--cols);column-gap:3em;column-rule:1px solid var(--line)}
.tx p{font:var(--bs)/var(--lh) var(--serif);margin:0 0 .9em;text-indent:2em;text-align:justify;color:#ddd8ca}
.tx h2{font:500 calc(var(--bs)*1.6)/1.5 var(--serif);margin:.3em 0 .8em;color:var(--ink)}
.turn{position:absolute;bottom:18px;display:flex;gap:10px}
.rfoot{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:8px 20px;min-height:68px;border-top:1px solid var(--line)}
.rfoot .l{display:flex;flex-direction:column;font-size:14px}.rfoot .l small{font-size:13px;color:var(--mut)}
.arrows{display:flex;gap:10px}
.arrows button{width:76px;height:54px;border-radius:14px;background:var(--raise);font-size:26px;border:1px solid var(--line)}
.arrows button:not(:disabled):hover{border-color:var(--amber);color:var(--amber)}

/* 线索卡 */
.cards{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:30px;padding:28px 30px;min-height:0;flex:1;overflow:auto}
[data-orient="port"] .cards{grid-template-columns:1fr}
.cards h2{font:500 26px var(--serif);margin:0 0 6px}
.clist{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:10px}
.clist button{width:100%;min-height:64px;padding:10px 16px;text-align:left;background:var(--sf);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;gap:2px}
.clist .n{font:500 19px var(--serif)}.clist .s{font-size:13px;color:var(--mut)}
.clist button.on{border-color:var(--amber);background:var(--amber-dim)}
.clist button.no{opacity:1;border-style:dashed;background:transparent}.clist button.no .s{color:var(--red)}
.view{background:var(--sf);border:1px solid var(--line);border-radius:14px;display:grid;place-items:center;padding:24px;min-height:360px}
.view figcaption{font-size:13px;color:var(--mut);margin-top:12px;text-align:center}

/* 公共对话（整页）与右侧对话栏共用的东西 */
.seg6{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.seg6 i{display:block;height:6px;border-radius:3px;background:var(--line)}
.seg6 i.done{background:#6b5a37}.seg6 i.current{background:var(--amber)}
.seg6 span{font-size:12px;color:var(--mut);margin-top:6px;display:block;text-align:center;white-space:nowrap}
.seg6 span.current{color:var(--amber);font-weight:600}
.pubhead{padding:18px 26px 14px;border-bottom:1px solid var(--line)}
.pubhead .t{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.pubhead .t b{font:500 24px var(--serif)}.pubhead .t small{font-size:14px;color:var(--mut)}
.pubgrid{display:grid;grid-template-columns:1fr 280px;flex:1;min-height:0}
[data-orient="port"] .pubgrid{grid-template-columns:1fr;grid-template-rows:auto 1fr}
.side-info{border-left:1px solid var(--line);padding:20px 22px;overflow:auto;background:var(--sf)}
[data-orient="port"] .side-info{border-left:0;border-bottom:1px solid var(--line);padding:0}
.side-info .tog{display:none;width:100%;min-height:52px;padding:0 24px;align-items:center;justify-content:space-between;font-size:15px;color:var(--soft)}
[data-orient="port"] .side-info .tog{display:flex}
[data-orient="port"] .side-info .body{display:none;padding:0 24px 18px}
[data-orient="port"] .side-info.open .body{display:block}
.hint{font-size:15px;color:var(--soft);line-height:1.8;margin:0 0 14px}
.ctl{display:grid;gap:8px}
.ctl button{min-height:44px;border:1px dashed var(--line);border-radius:10px;color:var(--mut);text-align:left;padding:0 14px;font-size:15px}
.ctl button:disabled{opacity:1}
.meta{font-size:13px;color:var(--mut);margin:8px 0 0}
.reveal{margin-top:14px;padding:12px 14px;border-left:3px solid var(--amber);background:var(--amber-dim);font:15px/1.8 var(--serif)}
.reveal p{margin:0}
.fs{flex:1;min-height:0;overflow:auto;padding:22px 26px}
ol.feed{list-style:none;margin:0 auto;padding:0;max-width:720px;display:flex;flex-direction:column;gap:12px}
.feed li{font-size:17px;line-height:1.8;max-width:82%;padding:10px 16px;border-radius:16px}
.feed li.host{align-self:flex-start;background:var(--raise);border-left:3px solid var(--amber);border-radius:6px 16px 16px 6px;font-family:var(--serif)}
.feed li.player{align-self:flex-end;background:var(--amber-dim);border-radius:16px 16px 4px 16px;color:var(--ink)}
.feed li.event{align-self:center;max-width:100%;font-size:13px;color:var(--mut);padding:0}

/* 右侧对话栏（读角色本、看线索卡时常驻） */
.side{display:flex;flex-direction:column;background:var(--sf);border-left:1px solid var(--line);min-height:0}
[data-orient="port"] .side{display:none}
[data-orient="port"] .side.sheet{display:flex;position:absolute;left:0;right:0;bottom:98px;height:44%;border-left:0;border-top:1px solid var(--amber);border-radius:18px 18px 0 0;box-shadow:0 -14px 40px rgba(0,0,0,.55);z-index:6}
.side .hd{padding:16px 20px 12px;border-bottom:1px solid var(--line)}
.side .hd b{font:500 17px var(--serif);display:block;margin-bottom:10px}
.side .hd small{display:block;font-size:13px;color:var(--mut);margin-top:6px}
.side .fs{padding:14px 16px}
.side .feed li{font-size:15px;max-width:94%;padding:8px 12px}

/* 发言条 */
.say{padding:10px 16px 10px;border-top:1px solid var(--line);background:var(--sf);flex:none}
.say .row{display:flex;gap:8px;align-items:flex-end}
.say textarea{flex:1;min-width:0;resize:none;min-height:52px;background:var(--bg);border:1px solid var(--line);border-radius:12px;color:var(--ink);padding:10px 14px;font:16px/1.6 var(--serif)}
.say textarea:disabled{opacity:.5}
.say .go{min-height:52px;padding:0 22px;border-radius:12px;background:var(--amber);color:var(--amber-ink);font-weight:600}
.say .go:disabled{background:var(--raise);color:var(--mut);opacity:1}
.say .stop{min-height:52px;padding:0 14px;border-radius:12px;border:1px solid var(--red);color:var(--red)}
.say .tg{min-height:52px;padding:0 16px;border-radius:12px;border:1px solid var(--line);color:var(--soft)}
.say .h{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin:4px 2px 0;min-height:20px}
.say .h.err{color:var(--red)}
.solo{border-top:1px solid var(--line)}
[data-orient="port"] .nav{position:relative;z-index:7}
</style>
</head>
<body>
<script>
/* ===== 共用示意数据与交互（三个方向共用，只换外观与骨架）=====
   全部是示意数据，不来自任何真实剧本。公开消息只有 kind + text 两个字段，角色只有名字与是否已认领。 */
const DATA = {
  roles: ['林白', '周望', '沈知', '顾青', '许然', '陈默'],
  othersClaimed: ['周望', '顾青'],
  me: '沈知',
  storyTitle: '示意剧本',
  address: 'http://192.168.1.23:5280',
  phases: ['开场', '自我介绍', '第一轮搜证', '集中讨论', '投票', '揭秘'],
  hints: { 2: '本环节可以互相交换信息，卡面只在各自设备上显示。', 4: '请在纸上写下你的选择，由主持人汇总。' },
  chapters: ['序章', '第一幕', '第二幕'],
  pages: [
    { ch: 0, blocks: [['h', '序章'], ['p', '雨从傍晚开始下。你站在门廊里，把伞收起来，听见屋里有人压低了声音说话，像是怕被谁听见。'], ['p', '这是示意正文：真实角色本在这里按你设定的字号与行距重新分页，翻页时位置会被记住。']] },
    { ch: 0, blocks: [['p', '你把外套搭在椅背上，注意到桌上的杯子还是温的。这一段只用来展示正文的行距、缩进与两端对齐。'], ['p', '换行之后的第二段同样是示意文字。宋体长文适合连续阅读，界面控件则保持无衬线。']] },
    { ch: 1, blocks: [['h', '第一幕'], ['p', '示意：第一幕的开头。标题与正文之间留出足够的空白，让眼睛有地方落脚。'], ['p', '这里同样是示意文字，用来观察一整页正文在不同字号下的疏密。']] },
    { ch: 1, blocks: [['p', '章节中间的一页。页码和章节名放在页脚，随时能看到自己读到了哪里。'], ['p', '示意文字，没有任何剧情内容。']] },
    { ch: 2, blocks: [['h', '第二幕'], ['p', '示意：第二幕的开头。识别文字可能有误，以原稿为准，这句提示常驻页脚。']] },
  ],
  srcPageCount: 12,
  cards: [
    { name: '线索卡 1', group: 'A 组', order: '第 1 张', ok: true },
    { name: '线索卡 2', group: 'A 组', order: '第 2 张', ok: true },
    { name: '线索卡 3', group: 'B 组', order: '第 1 张', ok: false, why: '这一组少正面，暂停分发' },
    { name: '线索卡 4', group: 'B 组', order: '第 2 张', ok: false, why: '切片还没确认，暂停分发' },
    { name: '线索卡 5', group: 'C 组', order: '第 1 张', ok: true },
    { name: '线索卡 6', group: 'C 组', order: '第 2 张', ok: true },
  ],
  feed: [
    ['event', '第 3 环节开始：第一轮搜证'],
    ['host', '现在进入搜证环节。请各位翻看自己的线索，需要放出的材料我会在电脑上点出。'],
    ['player', '我想先确认一下，这一环节能互相看手里的卡吗？'],
    ['host', '可以口头交流，但卡面只在各自设备上显示。'],
    ['player', '好，那我先说我这边的发现。'],
    ['event', '材料已放出：线索组 A'],
  ],
};

const SIZES = { land: [1180, 820, '平板横屏 1180×820'], port: [820, 1180, '平板竖屏 820×1180'], droid: [800, 1280, '安卓竖屏 800×1280'] };

const S = {
  screen: 'join', role: null, size: 'land', phase: 2, claimFail: false, copied: false, copyFail: false,
  mode: 'src', cols: 1, fit: 'width', zoom: 1, settings: false, focus: false, font: 20, spacing: 'relaxed',
  page: 0, srcPage: 3, cardSel: 0, panel: false, draft: '', notice: '', err: false,
  busy: false, speaking: false, simSendFail: false, extra: [],
};

const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const $ = (s, r = document) => r.querySelector(s);

/* 派生状态 */
const taken = (n) => DATA.othersClaimed.includes(n);
const feedAll = () => DATA.feed.concat(S.extra);
const phaseStatus = (i) => (i < S.phase ? 'done' : i === S.phase ? 'current' : 'upcoming');
const phaseOneLine = () => `${DATA.phases[S.phase]} · 第 ${S.phase + 1}/${DATA.phases.length} 环节`;
const controlLabels = () => (S.phase >= 4 ? ['确认提交汇总', '揭秘', '进入复盘', '暂停'] : ['结束搜证', '放出下一批材料', '暂停']);
const materialMeta = () => (S.phase === 2 ? '待放出材料 2 · 已放出 3' : '待放出材料 0 · 已放出 5');
const voteMeta = () => (S.phase >= 4 ? '投票汇总：林白 2 票，周望 1 票 · 共 3 票' : '');
const revealTexts = () => (S.phase === 5 ? ['（揭秘文本示意：主持人公开揭秘的文字显示在这里。）'] : []);
const hintText = () => DATA.hints[S.phase] || '';
const controlsNote = '请在电脑上操作';
const srcStep = () => S.cols;
const srcEnd = () => Math.min(S.srcPage + S.cols - 1, DATA.srcPageCount);
const srcLabel = () => (S.srcPage === srcEnd() ? `${S.srcPage}` : `${S.srcPage}～${srcEnd()}`);
const curPage = () => DATA.pages[S.page];
const chapterOf = () => curPage().ch;
const speech = () => {
  const hasRole = !!S.role;
  const hint = !hasRole ? '请先认领角色' : S.busy ? '主持正在回应' : S.notice;
  return {
    hasRole, canSend: hasRole && !S.busy && S.draft.trim().length > 0, hint, err: S.err && hasRole && !S.busy,
    count: S.draft.length, max: 300,
  };
};

/* 原稿页示意：纯 CSS 画出一页扫描件，不使用任何真实卡图或角色本 */
function scanPage(n) {
  let seed = n * 9301 + 49297;
  const rnd = () => ((seed = (seed * 9301 + 49297) % 233280) / 233280);
  const lines = Array.from({ length: 15 }, () => `<i style="width:${Math.round(58 + rnd() * 40)}%"></i>`).join('');
  return `<div class="scan"><b class="scan-title"></b><div class="scan-body">${lines}</div><span class="scan-no">${n}</span></div>`;
}
const cardFace = (c) => `<div class="cardface"><b></b><i></i><i></i><i style="width:60%"></i><em>卡面示意 · ${esc(c.name)}</em></div>`;

/* 共用的页面素材 */
function textPageHTML() {
  return curPage().blocks.map(([k, t]) => (k === 'h' ? `<h2 class="chapter">${esc(t)}</h2>` : `<p class="para">${esc(t)}</p>`)).join('');
}
const spacingValue = () => ({ tight: 1.6, relaxed: 1.95, loose: 2.3 }[S.spacing]);

/* ===== 行为 ===== */
let RENDER = null;
function patch(o) { Object.assign(S, o); redo(); }
function act(name, arg) {
  const total = DATA.pages.length;
  switch (name) {
    case 'go': S.screen = arg; S.panel = false; break;
    case 'claim':
      if (taken(arg)) { S.claimFail = true; break; }
      S.role = arg; S.claimFail = false; S.screen = 'book'; break;
    case 'release': S.role = null; S.screen = 'join'; S.panel = false; break;
    case 'copy':
      S.copied = true; S.copyFail = false;
      try { navigator.clipboard && navigator.clipboard.writeText(DATA.address); } catch (e) { /* 预览里复制失败不影响演示 */ }
      break;
    case 'mode': S.mode = arg; S.settings = false; break;
    case 'cols': S.cols = S.cols === 1 ? 2 : 1; break;
    case 'fit': S.fit = S.fit === 'width' ? 'page' : 'width'; S.zoom = 1; break;
    case 'zoom': S.fit = 'width'; S.zoom = Math.min(3, Math.max(0.5, S.zoom + Number(arg))); break;
    case 'settings': S.settings = !S.settings; break;
    case 'focus': S.focus = !S.focus; break;
    case 'font': S.font = Math.min(30, Math.max(16, S.font + Number(arg))); break;
    case 'spacing': S.spacing = arg; break;
    case 'turn':
      if (S.mode === 'src') S.srcPage = Math.min(DATA.srcPageCount, Math.max(1, S.srcPage + Number(arg) * srcStep()));
      else S.page = Math.min(total - 1, Math.max(0, S.page + Number(arg)));
      break;
    case 'chapter': S.page = DATA.pages.findIndex((p) => p.ch === Number(arg)); break;
    case 'card': S.cardSel = Number(arg); break;
    case 'panel': S.panel = !S.panel; break;
    case 'rail': S.rail = !S.rail; break;
    case 'send': {
      const m = speech();
      if (!m.canSend) break;
      if (S.simSendFail) { S.err = true; S.notice = '没有发出去：主持暂时没有回应，请再试一次'; break; }
      S.extra.push(['player', S.draft.trim()]); S.draft = ''; S.err = false; S.notice = '已发给大家'; break;
    }
    case 'stop': S.speaking = false; break;
  }
  if (name === 'copy') setTimeout(() => { S.copied = false; redo(); }, 2500);
  redo();
}

function redo() {
  const f = $('#frame');
  const had = document.activeElement && document.activeElement.id === 'speech-input';
  const feedEl = $('.feed-scroll', f);
  const keep = feedEl ? feedEl.scrollTop : 0;
  f.dataset.size = S.size;
  f.dataset.orient = S.size === 'land' ? 'land' : 'port';
  f.innerHTML = RENDER(S);
  const ta = $('#speech-input', f);
  if (ta) { ta.value = S.draft; if (had) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); } }
  const nf = $('.feed-scroll', f);
  if (nf) nf.scrollTop = keep || nf.scrollHeight;
  fit();
}

function fit() {
  const [w, h] = SIZES[S.size];
  const f = $('#frame'); const st = $('#stage');
  const ctl = $('#ctl').offsetHeight;
  const sc = Math.min((innerWidth - 24) / w, (innerHeight - ctl - 20) / h, 1);
  f.style.width = w + 'px'; f.style.height = h + 'px'; f.style.transform = `scale(${sc})`;
  st.style.width = w * sc + 'px'; st.style.height = h * sc + 'px';
}

/* 预览控制条：只在预览页里存在，不属于设计本身 */
const CHIPS = [
  ['wait', '等待选剧本', { screen: 'wait', role: null }],
  ['prep', '材料准备中', { screen: 'prep', role: null }],
  ['join', '加入页', { screen: 'join', role: null, claimFail: false }],
  ['joinf', '认领失败', { screen: 'join', role: null, claimFail: true }],
  ['src', '角色本·原稿', { screen: 'book', role: DATA.me, mode: 'src', settings: false, panel: false }],
  ['txt', '角色本·文字', { screen: 'book', role: DATA.me, mode: 'text', settings: false, panel: false }],
  ['set', '字号设置', { screen: 'book', role: DATA.me, mode: 'text', settings: true, panel: false }],
  ['cards', '线索卡', { screen: 'cards', role: DATA.me, panel: false }],
  ['pub', '公共·搜证', { screen: 'public', role: DATA.me, phase: 2, panel: false }],
  ['vote', '公共·投票', { screen: 'public', role: DATA.me, phase: 4, panel: false }],
  ['rev', '公共·揭秘', { screen: 'public', role: DATA.me, phase: 5, panel: false }],
  ['panel', '阅读时开对话', { screen: 'book', role: DATA.me, mode: 'src', panel: true }],
];

function mount(render, title) {
  RENDER = render;
  document.title = title;
  const chips = CHIPS.map(([id, label, p]) => `<button data-chip="${id}">${label}</button>`).join('');
  const sizes = Object.entries(SIZES).map(([k, v]) => `<button data-size="${k}">${v[2]}</button>`).join('');
  document.body.insertAdjacentHTML('afterbegin', `
    <div id="ctl"><div class="row"><strong>${esc(title)}</strong><span class="note">示意数据 · 预览控制条不属于设计</span></div>
    <div class="row">${chips}</div>
    <div class="row">${sizes}<label><input type="checkbox" data-flag="busy"> 主持正在回应</label><label><input type="checkbox" data-flag="speaking"> 主持朗读中</label><label><input type="checkbox" data-flag="simSendFail"> 发送出错</label></div></div>
    <div id="stage"><div id="frame"></div></div>`);
  document.addEventListener('click', (e) => {
    const c = e.target.closest('[data-chip]');
    if (c) { patch(CHIPS.find((x) => x[0] === c.dataset.chip)[2]); return; }
    const z = e.target.closest('#ctl [data-size]');
    if (z) { patch({ size: z.dataset.size }); return; }
    const a = e.target.closest('#frame [data-act]');
    if (a && !a.disabled) act(a.dataset.act, a.dataset.arg);
  });
  document.addEventListener('change', (e) => {
    const f = e.target.dataset.flag;
    if (f) { S[f] = e.target.checked; if (f === 'simSendFail' && !S.simSendFail) { S.err = false; S.notice = ''; } redo(); }
    if (e.target.dataset.spacing !== undefined) act('spacing', e.target.value);
  });
  document.addEventListener('input', (e) => {
    if (e.target.id !== 'speech-input') return;
    S.draft = e.target.value;
    const m = speech();
    const send = $('#frame [data-act="send"]'); if (send) send.disabled = !m.canSend;
    const cnt = $('#frame .speech-count'); if (cnt) cnt.textContent = `${m.count}/${m.max}`;
  });
  addEventListener('resize', fit);
  redo();
}


const ICON = {
  book: '<svg viewBox="0 0 24 24"><path d="M5 4h13a1 1 0 0 1 1 1v14H7a2 2 0 0 0-2 2V4z"/><path d="M5 19a2 2 0 0 1 2-2h12"/></svg>',
  cards: '<svg viewBox="0 0 24 24"><rect x="4" y="7" width="12" height="14" rx="2"/><path d="M8 4h10a2 2 0 0 1 2 2v12"/></svg>',
  chat: '<svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>',
};
const NAV = [['book', '角色本', 'book'], ['cards', '线索卡', 'cards'], ['public', '公共对话', 'chat']];

function nav(s) {
  if (!s.role) return `<nav class="nav"><span class="mark" aria-hidden="true">局</span><span class="sp"></span></nav>`;
  return `<nav class="nav" aria-label="平板功能"><span class="mark" aria-hidden="true">局</span>
    ${NAV.map(([id, l, ic]) => `<button class="it" data-act="go" data-arg="${id}" ${s.screen === id ? 'aria-current="page"' : ''}>${ICON[ic]}<span>${l}</span></button>`).join('')}
    <span class="sp"></span><span class="me" aria-label="我的角色：${esc(s.role)}">${esc(s.role)}</span><button class="out" data-act="release">退出重选</button></nav>`;
}

function sayBar(s, cls = '') {
  const m = speech();
  const showToggle = s.screen !== 'public' && s.role && s.size !== 'land';
  return `<div class="say ${cls}"><div class="row">
    <textarea id="speech-input" rows="1" maxlength="300" placeholder="对大家说点什么…" ${m.hasRole ? '' : 'disabled'}></textarea>
    ${s.speaking ? '<button class="stop" data-act="stop">停止朗读</button>' : ''}
    ${showToggle ? `<button class="tg" data-act="panel">${s.panel ? '收起' : '对话'}</button>` : ''}
    <button class="go" data-act="send" ${m.canSend ? '' : 'disabled'}>发送</button></div>
    <p class="h ${m.err ? 'err' : ''}"><span>${esc(m.hint)}</span><span class="speech-count">${m.count}/${m.max}</span></p></div>`;
}

const feedItems = (n) => `<ol class="feed">${feedAll().slice(-n).map(([k, t]) => `<li class="${k}">${esc(t)}</li>`).join('')}</ol>`;
const seg6 = () => `<div class="seg6">${DATA.phases.map((p, i) => `<div><i class="${phaseStatus(i)}"></i><span class="${phaseStatus(i)}">${p}</span></div>`).join('')}</div>`;

function sidePanel(s, sheet) {
  return `<aside class="side ${sheet ? 'sheet' : ''}" ${sheet ? '' : 'style="border-left:0;flex:1"'} aria-label="公共对话"><div class="hd"><b>${phaseOneLine()}</b>
    <div class="seg6">${DATA.phases.map((p, i) => `<div><i class="${phaseStatus(i)}"></i></div>`).join('')}</div></div>
    <div class="fs">${feedItems(8)}</div></aside>`;
}

function joinScreen(s) {
  return `<section class="join"><h1>加入本局</h1>
    <div class="addr"><span class="k">本局地址</span><output>${esc(DATA.address)}</output><button data-act="copy">${s.copied ? '已复制' : '复制'}</button></div>
    <p class="lead">与电脑连接同一 Wi-Fi 后打开本页即可，也可以扫描电脑上的二维码。选一个角色开始阅读；已被别人认领的角色不能再选。</p>
    <ul class="roles">${DATA.roles.map((r) => `<li><button data-act="claim" data-arg="${r}" ${taken(r) ? 'disabled' : ''}><span class="n">${r}</span><span class="s">${taken(r) ? '已被认领' : '可认领'}</span></button></li>`).join('')}</ul>
    ${s.claimFail ? '<p class="warn">这个角色刚被别人认领了，请另选一个。</p>' : ''}</section>`;
}

function reader(s) {
  const src = s.mode === 'src';
  const total = src ? DATA.srcPageCount : DATA.pages.length;
  const label = src ? srcLabel() : s.page + 1;
  const prevOff = src ? s.srcPage <= 1 : s.page <= 0;
  const nextOff = src ? srcEnd() >= DATA.srcPageCount : s.page >= total - 1;
  const settings = s.settings && !src ? `<div class="set"><h2>按你的习惯阅读</h2>
    <div class="step"><button data-act="font" data-arg="-1" aria-label="减小字号" ${s.font <= 16 ? 'disabled' : ''}>A−</button><output>${s.font}</output><button data-act="font" data-arg="1" aria-label="增大字号" ${s.font >= 30 ? 'disabled' : ''}>A＋</button></div>
    <label>行间留白 <select data-spacing>${[['tight', '紧凑'], ['relaxed', '舒展'], ['loose', '宽松']].map(([v, l]) => `<option value="${v}" ${s.spacing === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
    <p>字号和屏幕变化后按文本位置重新分页。阅读器页码与原稿页码不同。</p></div>` : '';
  let body;
  if (src) {
    const pages = []; for (let p = s.srcPage; p <= srcEnd(); p++) pages.push(scanPage(p));
    body = `<div class="page"><div class="sw ${s.fit === 'page' ? 'fitpage' : 'fitwidth'}" style="--zoom:${s.zoom}"><div class="sp2 w${pages.length}">${pages.join('')}</div></div></div>`;
  } else {
    body = `<div class="page" style="--bs:${s.font}px;--lh:${spacingValue()};--cols:${s.cols}">
      <nav class="chnav" aria-label="角色本章节">${DATA.chapters.map((c, i) => `<button data-act="chapter" data-arg="${i}" ${i === chapterOf() ? 'aria-current="location"' : ''}>${c}</button>`).join('')}</nav>
      <article class="tx" tabindex="0" aria-label="当前页正文">${textPageHTML()}</article></div>`;
  }
  const foot = src ? [`原稿 · 第 ${label} / ${total} 页`, '可缩放查看'] : [`第 ${chapterOf() + 1} 章 · ${DATA.chapters[chapterOf()]}`, '识别文字可能有误，以原稿为准'];
  return `<section class="rd"><div class="rtools"><span class="who">${esc(s.role)}</span><span class="pg">第 ${label} / ${total} 页</span>
    <div class="seg"><button data-act="mode" data-arg="src" aria-pressed="${src}">原稿</button><button data-act="mode" data-arg="text" aria-pressed="${!src}">文字重排</button></div>
    <button class="pill" data-act="cols">${s.cols === 1 ? '双栏' : '单栏'}</button>
    ${src ? `<button class="pill" data-act="fit">${s.fit === 'page' ? '适合宽度' : '整页'}</button><button class="pill" aria-label="缩小原稿" data-act="zoom" data-arg="-0.25" ${s.zoom <= 0.5 ? 'disabled' : ''}>−</button><button class="pill" aria-label="放大原稿" data-act="zoom" data-arg="0.25" ${s.zoom >= 3 ? 'disabled' : ''}>＋</button>`
      : `<button class="pill" data-act="settings" aria-expanded="${s.settings}">Aa</button>`}
    <button class="pill" data-act="focus">${s.focus ? '退出专注' : '专注'}</button></div>${settings}${body}
    <footer class="rfoot"><div class="l"><span>${foot[0]}</span><small>${foot[1]}</small></div>
    <div class="arrows"><button data-act="turn" data-arg="-1" aria-label="上一页" ${prevOff ? 'disabled' : ''}>‹</button><button data-act="turn" data-arg="1" aria-label="下一页" ${nextOff ? 'disabled' : ''}>›</button></div></footer></section>`;
}

function cardsScreen(s) {
  const c = DATA.cards[s.cardSel];
  return `<section class="cards"><div><h2>全部线索卡</h2><p class="lead">点哪张看哪张，只在这台设备上显示。暂停分发的组用纸质卡。</p>
    <ul class="clist">${DATA.cards.map((k, i) => k.ok
      ? `<li><button class="${i === s.cardSel ? 'on' : ''}" data-act="card" data-arg="${i}"><span class="n">${k.name}</span><span class="s">${k.group} · ${k.order}</span></button></li>`
      : `<li><button class="no" disabled><span class="n">${k.name}</span><span class="s">${k.group} · ${k.order} · ${k.why}，请用纸质卡</span></button></li>`).join('')}</ul></div>
    <figure class="view" style="margin:0"><div style="width:100%">${cardFace(c)}<figcaption>线索卡 · 正面（示意）</figcaption></div></figure></section>`;
}

function publicScreen(s) {
  const reveal = revealTexts();
  const info = `<aside class="side-info ${s.rail ? 'open' : ''}" aria-label="本局进度"><button class="tog" data-act="rail" aria-expanded="${!!s.rail}"><span>${phaseOneLine()}</span><span>${s.rail ? '收起' : '展开'}</span></button>
    <div class="body">${hintText() ? `<p class="hint">${hintText()}</p>` : ''}
    <div class="ctl">${controlLabels().map((l) => `<button disabled>${l}</button>`).join('')}</div><p class="meta">${controlsNote}</p>
    <p class="meta">${materialMeta()}</p>${voteMeta() ? `<p class="meta">${voteMeta()}</p>` : ''}
    ${reveal.length ? `<div class="reveal">${reveal.map((t) => `<p>${t}</p>`).join('')}</div>` : ''}</div></aside>`;
  return `<section class="rd"><div class="pubhead"><div class="t"><b>${DATA.phases[s.phase]}</b><small>${DATA.storyTitle} · 第 ${s.phase + 1}/${DATA.phases.length} 环节</small></div>${seg6()}</div>
    <div class="pubgrid"><div class="fs">${feedItems(99)}</div>${info}</div></section>`;
}

function render(s) {
  let main;
  const land = s.size === 'land';
  if (s.screen === 'wait') main = '<section class="center"><div class="ring"></div><h1>等待主持人选剧本</h1><p class="lead">电脑一打开剧本，这里会自动变成选角色页，不用刷新。</p></section>';
  else if (s.screen === 'prep') main = `<section class="center"><div class="ring"></div><h1>材料准备中</h1><p class="lead">《${DATA.storyTitle}》的卡片正在准备，几秒后自动开始。</p></section>`;
  else if (s.screen === 'join' || !s.role) main = joinScreen(s);
  else if (s.screen === 'book') main = reader(s);
  else if (s.screen === 'cards') main = cardsScreen(s);
  else main = publicScreen(s);
  const withSide = s.role && s.screen !== 'public' && land;
  const sheet = s.role && s.screen !== 'public' && !land && s.panel;
  // 横屏时右侧对话栏自带发言条；竖屏与公共页用底部发言条。
  const col = `<div class="col"><div class="scroll" style="display:flex;flex-direction:column">${main}</div>${withSide ? '' : sayBar(s, 'solo')}${sheet ? sidePanel(s, true) : ''}</div>`;
  const side = withSide ? `<div class="col" style="border-left:1px solid var(--line)">${sidePanel(s, false)}${sayBar(s)}</div>` : '';
  return `<div class="d2">${nav(s)}<div class="stage ${withSide ? 'with-side' : ''}">${col}${side}</div></div>`;
}
mount(render, '方向二 · 暗室');
</script>
</body>
</html>
