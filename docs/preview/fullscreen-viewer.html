<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>原稿相册式全屏查看 · 预览</title>
<style>
:root {
    --paper: #fbfaf7; --paper-deep: #efede7; --ink: #292823; --ink-soft: #5b564c;
    --rule: #dedbd2; --seal: #943f32; --muted: #716d63;
    --serif: "Noto Serif SC", "Songti SC", "SimSun", "Source Han Serif SC", serif;
    --sans: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper-deep); color: var(--ink); font: 14px/1.6 var(--sans); }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { opacity: .35; cursor: default; }
button:focus-visible { outline: 2px solid var(--seal); outline-offset: 3px; }

.shell { max-width: 1100px; margin: 0 auto; padding-bottom: 40px; }
.bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 22px; background: var(--paper); border-bottom: 1px solid var(--rule); font-size: 13px; letter-spacing: .08em; }
.bar b { color: var(--seal); font-weight: 500; }
.bar span { font-size: 12px; color: var(--muted); letter-spacing: 0; }
h2 { font: 500 18px/1.4 var(--serif); margin: 22px 22px 8px; }
.note { margin: 0 22px 12px; font-size: 12px; color: var(--muted); }

.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 22px; padding: 10px 0; border-bottom: 1px solid var(--rule); }
.tools button { min-height: 40px; min-width: 40px; padding: 6px 12px; border: 1px solid var(--rule); background: var(--paper); }
.tools button.on { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.tools .zl { font-size: 12px; color: var(--muted); min-width: 44px; text-align: center; }
.tools .sp { flex: 1; }

.vp { margin: 0 22px; height: 480px; overflow: auto; background: var(--paper-deep); border: 1px solid var(--rule); border-top: 0; padding: 14px; }
.spread { display: flex; gap: 12px; justify-content: center; width: max-content; min-width: 100%; }
.pg { flex: none; border: 1px solid var(--rule); background: var(--paper); box-shadow: 0 2px 10px rgba(41,40,35,.12); cursor: zoom-in; padding: 0; display: block; }
.pg img { display: block; width: 100%; height: 100%; -webkit-user-drag: none; user-select: none; }
.fit-page .pg { height: calc(450px * var(--z, 1)); aspect-ratio: 3 / 4; }
.fit-width .pg { width: calc((100% - 12px) / 2 * var(--z, 1)); aspect-ratio: 3 / 4; }
.fit-width .spread { width: calc(100% * var(--z, 1)); min-width: 0; }

.pager { display: flex; justify-content: space-between; align-items: center; margin: 12px 22px 0; }
.pager button { min-height: 44px; padding: 8px 18px; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); }
.pager button:hover:not(:disabled) { background: var(--seal); border-color: var(--seal); }
.pager .pos { font-size: 13px; color: var(--ink-soft); }

.clue { margin: 0 22px; display: inline-block; width: 280px; border: 1px solid var(--rule); background: var(--paper); box-shadow: 0 2px 10px rgba(41,40,35,.12); cursor: zoom-in; padding: 0; }
.clue img { display: block; width: 100%; -webkit-user-drag: none; user-select: none; }

/* ===== 全屏查看器 ===== */
#fs { position: fixed; inset: 0; z-index: 10; background: #000; color: #eee; overflow: hidden; }
#fs[hidden] { display: none; }
#stage { position: absolute; inset: 0; touch-action: none; overflow: hidden; user-select: none; -webkit-user-select: none; }
#track { display: flex; height: 100%; will-change: transform; }
.slide { flex: none; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.slide img { max-width: 100%; max-height: 100%; width: 100%; height: 100%; object-fit: contain; -webkit-user-drag: none; pointer-events: none; will-change: transform; }
.fs-top { position: absolute; top: 0; left: 0; right: 0; z-index: 2; display: flex; justify-content: center; align-items: center; height: 52px; background: linear-gradient(#000a, #0000); pointer-events: none; }
#fsTitle { font: 15px var(--sans); letter-spacing: .12em; }
#fsClose { position: absolute; right: 8px; top: 4px; width: 44px; height: 44px; border: 0; background: none; color: #eee; font-size: 22px; pointer-events: auto; }
.arrow { position: absolute; top: 50%; z-index: 2; width: 48px; height: 72px; margin-top: -36px; border: 0; background: rgba(255,255,255,.12); color: #eee; font-size: 30px; }
.arrow:hover:not(:disabled) { background: rgba(148,63,50,.7); }
#fsPrev { left: 8px; } #fsNext { right: 8px; }
.fs-hint { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; font-size: 11px; color: #888; pointer-events: none; }
@media (max-width: 640px) { .vp { height: 380px; } .fit-page .pg { height: calc(340px * var(--z, 1)); } }
</style>
</head>
<body>
<div class="shell">
    <div class="bar"><b>角色本 · 阅读器（预览）</b><span>占位页，无剧本内容</span></div>

    <h2>原稿</h2>
    <p class="note">点任意一页进入全屏。关闭后会回到最后看的那一屏。</p>
    <div class="tools">
        <button id="fitPage" class="on">整页</button>
        <button id="fitWidth">适合宽度</button>
        <span class="sp"></span>
        <button id="zOut" aria-label="缩小">−</button>
        <span class="zl" id="zl">100%</span>
        <button id="zIn" aria-label="放大">＋</button>
    </div>
    <div class="vp fit-page" id="vp"><div class="spread" id="spread"></div></div>
    <div class="pager">
        <button id="prev">‹ 上一屏</button>
        <span class="pos" id="pos"></span>
        <button id="next">下一屏 ›</button>
    </div>

    <h2>线索卡</h2>
    <p class="note">单张图，点开也是全屏，但没有左右切换。</p>
    <button class="clue" id="clue" aria-label="查看线索卡"><img id="clueImg" alt="线索卡"></button>
</div>

<div id="fs" hidden>
    <div id="stage"><div id="track"></div></div>
    <div class="fs-top"><span id="fsTitle"></span><button id="fsClose" aria-label="关闭">✕</button></div>
    <button class="arrow" id="fsPrev" aria-label="上一页">‹</button>
    <button class="arrow" id="fsNext" aria-label="下一页">›</button>
    <div class="fs-hint" id="fsHint">左右滑动翻页 · 双击或双指放大 · 返回键关闭</div>
</div>

<script>
"use strict";
const N = 12;
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

/* ---------- 占位页（纯 SVG，只有页码和假线条） ---------- */
function rng(seed) { let a = seed * 9301 + 49297; return () => ((a = (a * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff); }
function svgUrl(svg) { return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg); }
function pageUrl(n) {
    const r = rng(n + 3);
    let body = "";
    for (let y = 150, k = 0; y < 700; y += 26, k++) {
        const para = k % 7 === 6;
        const w = para ? 120 + r() * 120 : 440 - (r() < .25 ? r() * 150 : 0);
        body += `<rect x="80" y="${y}" width="${w.toFixed(0)}" height="7" rx="3" fill="#5b564c" opacity="${para ? .18 : .3}"/>`;
    }
    const box = n % 4 === 0 ? `<rect x="80" y="330" width="440" height="110" fill="#efede7" stroke="#dedbd2"/>` : "";
    return svgUrl(`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
<rect width="600" height="800" fill="#fbfaf7"/><rect x="24" y="24" width="552" height="752" fill="none" stroke="#dedbd2"/>
<text x="300" y="86" text-anchor="middle" font-family="SimSun,serif" font-size="34" fill="#292823" letter-spacing="4">原稿第 ${n} 页</text>
<line x1="80" y1="112" x2="520" y2="112" stroke="#943f32" stroke-width="2"/>${body}${box}
<text x="300" y="758" text-anchor="middle" font-family="serif" font-size="16" fill="#716d63">— ${n} —</text></svg>`);
}
const clueUrl = svgUrl(`<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420">
<rect width="640" height="420" fill="#fbfaf7"/><rect x="16" y="16" width="608" height="388" fill="none" stroke="#943f32" stroke-width="2" stroke-dasharray="8 6"/>
<text x="320" y="82" text-anchor="middle" font-family="SimSun,serif" font-size="36" fill="#943f32" letter-spacing="8">线索卡</text>
<g fill="#5b564c" opacity=".3"><rect x="70" y="130" width="500" height="8" rx="4"/><rect x="70" y="164" width="430" height="8" rx="4"/><rect x="70" y="198" width="470" height="8" rx="4"/><rect x="70" y="232" width="360" height="8" rx="4"/><rect x="70" y="266" width="450" height="8" rx="4"/></g>
<circle cx="540" cy="340" r="30" fill="none" stroke="#943f32" stroke-width="3" opacity=".6"/></svg>`);
const pages = Array.from({ length: N }, (_, i) => pageUrl(i + 1));
$("#clueImg").src = clueUrl;

/* ---------- 嵌入式阅读器：双栏，按 1-2、3-4… 分屏 ---------- */
const R = { spread: 0, fit: "page", z: 1 };
const spreads = Math.ceil(N / 2);
function renderReader() {
    const a = R.spread * 2;
    $("#spread").innerHTML = [a, a + 1].filter(i => i < N)
        .map(i => `<button class="pg" data-i="${i}" aria-label="查看原稿第 ${i + 1} 页"><img src="${pages[i]}" alt="原稿第 ${i + 1} 页"></button>`).join("");
    const vp = $("#vp");
    vp.className = "vp fit-" + R.fit;
    vp.style.setProperty("--z", R.z);
    vp.scrollTop = vp.scrollLeft = 0;
    $("#fitPage").classList.toggle("on", R.fit === "page");
    $("#fitWidth").classList.toggle("on", R.fit === "width");
    $("#zl").textContent = Math.round(R.z * 100) + "%";
    $("#pos").textContent = `第 ${a + 1}–${Math.min(a + 2, N)} 页 / 共 ${N} 页`;
    $("#prev").disabled = R.spread === 0;
    $("#next").disabled = R.spread === spreads - 1;
}
$("#prev").onclick = () => { R.spread--; renderReader(); };
$("#next").onclick = () => { R.spread++; renderReader(); };
$("#fitPage").onclick = () => { R.fit = "page"; renderReader(); };
$("#fitWidth").onclick = () => { R.fit = "width"; renderReader(); };
$("#zIn").onclick = () => { R.z = Math.min(2, +(R.z + .25).toFixed(2)); renderReader(); };
$("#zOut").onclick = () => { R.z = Math.max(.5, +(R.z - .25).toFixed(2)); renderReader(); };
$("#spread").onclick = e => { const b = e.target.closest(".pg"); if (b) openViewer(pages, +b.dataset.i, false); };
$("#clue").onclick = () => openViewer([clueUrl], 0, true);

/* ---------- 全屏查看器 ---------- */
const stage = $("#stage"), track = $("#track");
const V = { open: false, list: [], i: 0, single: false, s: 1, tx: 0, ty: 0, dx: 0 };
const W = () => stage.clientWidth;
const curImg = () => track.children[V.i].firstChild;

function applyTrack(anim) {
    track.style.transition = anim ? "transform .28s ease" : "none";
    track.style.transform = `translateX(${-V.i * W() + V.dx}px)`;
}
function clampPan() {
    const img = curImg(), r = stage.getBoundingClientRect();
    const fit = Math.min(r.width / (img.naturalWidth || 1), r.height / (img.naturalHeight || 1));
    const mx = Math.max(0, ((img.naturalWidth || r.width) * fit * V.s - r.width) / 2);
    const my = Math.max(0, ((img.naturalHeight || r.height) * fit * V.s - r.height) / 2);
    V.tx = clamp(V.tx, -mx, mx); V.ty = clamp(V.ty, -my, my);
}
function applyZoom(anim) {
    clampPan();
    const img = curImg();
    img.style.transition = anim ? "transform .2s ease" : "none";
    img.style.transform = `translate(${V.tx}px, ${V.ty}px) scale(${V.s})`;
}
function resetZoom() { V.s = 1; V.tx = V.ty = 0; }
/* 以屏幕点 (x,y) 为不动点缩放到 s（transform-origin 为舞台中心） */
function zoomAt(x, y, s, anim) {
    const r = stage.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const qx = (x - cx - V.tx) / V.s, qy = (y - cy - V.ty) / V.s;
    V.tx = x - cx - s * qx; V.ty = y - cy - s * qy; V.s = s;
    applyZoom(anim);
}
function updateUi() {
    $("#fsTitle").textContent = V.single ? "线索卡" : `第 ${V.i + 1} / ${V.list.length} 页`;
    $("#fsPrev").hidden = $("#fsNext").hidden = V.single;
    $("#fsPrev").disabled = V.i === 0;
    $("#fsNext").disabled = V.i === V.list.length - 1;
}
function go(d) {
    const j = V.i + d;
    if (V.single || j < 0 || j >= V.list.length) { V.dx = 0; applyTrack(true); return; }
    const old = curImg(); old.style.transform = ""; old.style.transition = "none";
    resetZoom(); V.i = j; V.dx = 0; applyTrack(true); updateUi();
}

function openViewer(list, i, single) {
    Object.assign(V, { open: true, list, i, single, dx: 0 }); resetZoom();
    track.innerHTML = list.map((u, k) => `<div class="slide"><img src="${u}" alt="${single ? "线索卡" : "原稿第 " + (k + 1) + " 页"}" draggable="false"></div>`).join("");
    $("#fs").hidden = false;
    document.body.style.overflow = "hidden";
    applyTrack(false); updateUi();
    history.pushState({ fs: 1 }, "");
}
function closeUi() {
    if (!V.open) return;
    V.open = false; $("#fs").hidden = true; document.body.style.overflow = "";
    if (!V.single) { R.spread = Math.floor(V.i / 2); renderReader(); }
}
function requestClose() { if (history.state && history.state.fs) history.back(); else closeUi(); }
window.addEventListener("popstate", closeUi);
$("#fsClose").onclick = requestClose;
$("#fsPrev").onclick = () => go(-1);
$("#fsNext").onclick = () => go(1);
window.addEventListener("resize", () => { if (V.open) { applyTrack(false); applyZoom(false); } });
window.addEventListener("keydown", e => {
    if (!V.open) return;
    if (e.key === "Escape") requestClose();
    else if (e.key === "ArrowLeft") go(-1);
    else if (e.key === "ArrowRight") go(1);
});

/* 手势：单指/鼠标拖动切页（放大时改为平移）、双指捏合、双击放大/复原、滚轮缩放 */
const ptrs = new Map();
let g = null, lastTap = null;
const mid = () => { const [a, b] = [...ptrs.values()]; return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, d: Math.hypot(a.x - b.x, a.y - b.y) || 1 }; };

stage.addEventListener("pointerdown", e => {
    stage.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 1) {
        g = { mode: "", sx: e.clientX, sy: e.clientY, tx0: V.tx, ty0: V.ty, t: Date.now(), moved: false };
        V.dx = 0; applyTrack(false);
    } else if (ptrs.size === 2) {
        const m = mid();
        g = { mode: "pinch", m0: m, d0: m.d, s0: V.s, tx0: V.tx, ty0: V.ty, moved: true };
        V.dx = 0; applyTrack(false);
    }
});
stage.addEventListener("pointermove", e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (!g) return;
    if (g.mode === "pinch" && ptrs.size >= 2) {
        const m = mid(), r = stage.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        const s = clamp(g.s0 * m.d / g.d0, 1, 5);
        const qx = (g.m0.x - cx - g.tx0) / g.s0, qy = (g.m0.y - cy - g.ty0) / g.s0;
        V.s = s; V.tx = m.x - cx - s * qx; V.ty = m.y - cy - s * qy;
        applyZoom(false); return;
    }
    if (ptrs.size !== 1) return;
    const dx = e.clientX - g.sx, dy = e.clientY - g.sy;
    if (!g.moved && Math.hypot(dx, dy) < 6) return;
    g.moved = true;
    if (!g.mode) g.mode = V.s > 1.01 ? "pan" : (Math.abs(dx) >= Math.abs(dy) ? "swipe" : "none");
    if (g.mode === "pan") { V.tx = g.tx0 + dx; V.ty = g.ty0 + dy; applyZoom(false); }
    else if (g.mode === "swipe") {
        const edge = (V.i === 0 && dx > 0) || (V.i === V.list.length - 1 && dx < 0);
        V.dx = V.single ? dx / 4 : (edge ? dx / 3 : dx);
        applyTrack(false);
    }
});
function endPointer(e) {
    if (!ptrs.delete(e.pointerId) || !g) return;
    if (g.mode === "pinch") {
        if (V.s < 1.05) { resetZoom(); applyZoom(true); }
        if (ptrs.size === 1) { // 剩一指：继续当作平移，不触发切页
            const p = [...ptrs.values()][0];
            g = { mode: "pan", sx: p.x, sy: p.y, tx0: V.tx, ty0: V.ty, moved: true };
        } else if (ptrs.size === 0) g = null;
        return;
    }
    if (ptrs.size) return;
    if (g.mode === "swipe") {
        const dx = e.clientX - g.sx, fast = Date.now() - g.t < 300 && Math.abs(dx) > 40;
        if (e.type === "pointerup" && (Math.abs(dx) > W() * .18 || fast)) go(dx < 0 ? 1 : -1);
        else { V.dx = 0; applyTrack(true); }
    } else if (!g.moved && e.type === "pointerup") {
        const now = Date.now();
        if (lastTap && now - lastTap.t < 320 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 30) {
            lastTap = null;
            if (V.s > 1.01) { resetZoom(); applyZoom(true); } else zoomAt(e.clientX, e.clientY, 2.5, true);
        } else lastTap = { t: now, x: e.clientX, y: e.clientY };
    }
    g = null;
}
stage.addEventListener("pointerup", endPointer);
stage.addEventListener("pointercancel", endPointer);
stage.addEventListener("wheel", e => {
    e.preventDefault();
    const s = clamp(V.s * (e.deltaY < 0 ? 1.15 : 1 / 1.15), 1, 5);
    if (s < 1.02) { resetZoom(); applyZoom(true); } else zoomAt(e.clientX, e.clientY, s, false);
}, { passive: false });

renderReader();
</script>
</body>
</html>
